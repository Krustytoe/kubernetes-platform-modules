name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [eks-cluster, aks-cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
      - name: fmt check
        run: terraform fmt -check -recursive
      - name: init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}
      - name: validate
        run: terraform validate
        working-directory: modules/${{ matrix.module }}
      - name: test
        run: terraform test
        working-directory: modules/${{ matrix.module }}
        if: hashFiles(format('modules/{0}/tests/*.tftest.hcl', matrix.module)) != ''

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest
      - run: tflint --init
        env:
          # Authenticated plugin download; anonymous GitHub API calls get rate-limited on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive
